name: channel checks

# The npm channel is tested where it will break: packlist invariants, the CLI's
# init/upgrade loop on a real temp workspace, and the kernel's structural check.
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the smoke's real-0.3 migration case seeds from the
          # released master commit via git archive — shallow clones skip it
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Release gate (packlist, version anchor, no local state)
        run: node scripts/verify-release.js

      - name: Channel smoke (init / existing AGENTS.md / upgrade / --force / --check)
        run: node test/smoke.js

      - name: Kernel structural validation
        run: python3 .owfa/scripts/owfa_kernel.py validate

      - name: Kernel unit tests (unittest discover, both suites)
        run: python3 -m unittest discover -s .owfa/tests -p "test_*.py"
